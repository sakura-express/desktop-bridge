name: Experimental macOS native desktop probe
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Disposable macOS runner (no MCP service or public preview)'
        type: choice
        options: [macos-15, macos-15-intel, macos-26, macos-26-intel]
        default: macos-26
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned probe dependencies (no browser download)
        run: |
          python -m pip install 'Pillow==12.2.0' 'playwright==1.62.0' \
            'pyobjc-core==11.1' 'pyobjc-framework-Cocoa==11.1' 'pyobjc-framework-Quartz==11.1'
      - name: Check pure logic
        run: python -m unittest discover -s tests -p test_macos_probe.py -v
      - name: Probe real native desktop
        run: python scripts/macos_probe.py --output macos-probe-artifacts
      - name: Describe experimental evidence
        if: always()
        run: |
          echo '## Experimental macOS native desktop probe' >> "$GITHUB_STEP_SUMMARY"
          echo 'This is not complete macOS MCP support. Check report.json stages and before/after PNG color markers. Finder PNG requires manual review, never automatic PASS. Missing report means setup did not complete.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f macos-probe-artifacts/report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('macos-probe-artifacts/report.json').read_text())
          print('\nResult:', report['result'])
          for stage in report['stages']:
              print(f"- {stage['stage']}: {stage['status']}")
          PY
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-probe-${{ inputs.runner }}-${{ github.run_id }}
          path: macos-probe-artifacts/
          retention-days: 3
          if-no-files-found: warn
